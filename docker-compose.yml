networks:
  appnet:

services:
  nginx:
    image: nginx:alpine
    container_name: simojang-nginx
    ports:
      - "8105:80"
    volumes:
      - ./apps/admin:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - appnet
    environment:
      - TZ=Asia/Jakarta
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  app:
    build: .
    container_name: simojang-app
    volumes:
      - ./apps/admin:/var/www/html
    environment:
      - TZ=Asia/Jakarta
    networks:
      - appnet
    depends_on:
      - redis

  redis:
    image: redis:alpine
    container_name: simojang-redis
    environment:
      - TZ=Asia/Jakarta
    ports:
      - "6379:6379"
    networks:
      - appnet
